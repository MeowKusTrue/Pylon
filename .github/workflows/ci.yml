# Every push / pull request: make sure it still builds and the regression checks (tests/Checks) pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Pylon/Pylon.csproj -c Release
      - run: dotnet run --project tests/Checks -c Release
        env:
          PYLON_DATA: ${{ runner.temp }}\pylon-checks
      - name: Measure performance on an isolated profile
        run: ./tools/Measure-Performance.ps1 -Exe Pylon/bin/Release/net10.0-windows10.0.19041.0/win-x64/Pylon.exe -OutFile performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance
          path: |
            performance.json
            performance.json.startup.log
