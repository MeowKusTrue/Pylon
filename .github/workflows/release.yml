# Push a tag like v1.2.0 -> builds the installer and portable zip and publishes a GitHub release.
# Installed copies of Pylon find it through the in-app updater (Pylon/Updater.cs).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need the previous tag

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '')

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @files --title "Pylon $($env:GITHUB_REF_NAME -replace '^v', '')" --generate-notes
