# Push a tag like v1.2.0 -> builds the installer and portable zip and publishes a GitHub release.
# Installed copies of Pylon find it through the in-app updater (Pylon/Updater.cs).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need the previous tag

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup and Velopack
        run: |
          choco install innosetup -y --no-progress
          dotnet tool install -g vpk

      - name: Build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }} # lets build.ps1 fetch the previous release for the delta package
        run: ./build.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '')

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          # Velopack: setup, portable zip, full + delta packages and the update feed (releases.win.json)
          vpk upload github -o dist\releases --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --token $env:GH_TOKEN `
            --publish --tag $env:GITHUB_REF_NAME --releaseName "Pylon $version"
          # bridge for 1.0-1.2 (their updater looks for *-setup-win-x64.exe) and the changelog as the release notes
          $bridge = "dist\releases\Pylon-$version-setup-win-x64.exe"
          if (Test-Path $bridge) { gh release upload $env:GITHUB_REF_NAME $bridge --clobber }
          # the release page starts with which file to take (many download from here); the app's own "what's new" stays plain
          $setup = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/Pylon-win-Setup.exe"
          $hint = "**Скачайте [Pylon-win-Setup.exe]($setup) и запустите — это всё.** Остальные файлы ниже нужны для обновлений, их скачивать не надо.`n`n" +
                  "**Download [Pylon-win-Setup.exe]($setup) and open it — that's all.** The other files below are for updates; you don't need them.`n`n---`n`n"
          Set-Content dist\release-page.md ($hint + (Get-Content dist\notes.md -Raw)) -Encoding utf8
          gh release edit $env:GITHUB_REF_NAME --notes-file dist\release-page.md
